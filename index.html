<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cifrado ⇄ Notas · acordes de guitarra</title>
<meta name="description" content="Aprende y memoriza los acordes de guitarra: círculo de quintas, diagramas, teoría y examen." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

<style>
:root{
  --cream:#F5F0E5; --paper:#FBF8F1; --ink:#28211A; --soft:#6B5F4E; --rule:#D8CDB6; --line:#BCAE92;
  --green:#2B8C54; --greenbg:#EAF2E9; --red:#B23B2E; --redbg:#F5E7E2;
  --display:'Playfair Display',Georgia,serif; --body:'EB Garamond',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--body);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;}
.shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.serif{font-family:var(--display)}
/* top bar */
.top{display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px 8px;color:var(--soft);
  font-size:13px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--cream);z-index:5;}
/* content */
.content{flex:1;padding:18px 16px calc(96px + env(safe-area-inset-bottom));}
.h1{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.06;text-align:center;margin:6px 0 4px;}
.sub{text-align:center;color:var(--soft);font-size:16px;font-style:italic;margin:0 0 18px;}
.rule{height:1px;background:var(--rule);border:0;margin:14px 0;}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:16px;}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--soft);border:1px solid var(--rule);
  border-radius:99px;padding:4px 10px;background:var(--paper);}
.section-h{font-family:var(--display);font-weight:600;font-size:20px;margin:18px 0 10px;}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:0 0 2px;}
/* choices / buttons */
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--paper);
  border:1px solid var(--rule);border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer;
  font-family:inherit;font-size:18px;color:var(--ink);}
.choice:active{transform:translateY(1px)}
.choice .ic{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:var(--cream);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.opt{display:block;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
  border-radius:14px;padding:15px 16px;margin-bottom:11px;cursor:pointer;font-family:inherit;font-size:17px;color:var(--ink);}
.opt.ok{border-color:var(--green);background:var(--greenbg)}
.opt.no{border-color:var(--red);background:var(--redbg)}
.opt.dim{opacity:.45}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--ink);
  color:var(--cream);border:0;border-radius:14px;padding:15px;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer}
.primary.green{background:var(--green)}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1.5px solid var(--line);
  border-radius:14px;padding:13px;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;width:100%}
.iconbtn{background:transparent;border:0;cursor:pointer;color:var(--soft);padding:6px;display:flex}
/* quiz */
.track{flex:1;height:12px;background:#e7ddc7;border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:99px;transition:width .35s ease}
.prompt-l{color:var(--soft);text-align:center;font-size:15px;margin-bottom:6px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,13vw,54px);text-align:center;margin:4px 0 2px}
.banner{border-radius:16px;padding:14px 15px;margin-top:4px}
.banner.ok{background:var(--greenbg);border:1px solid var(--green)}
.banner.no{background:var(--redbg);border:1px solid var(--red)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:99px;background:#dcd2bb}
.dot.on{background:var(--ink);width:20px}
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--rule)}
.tbl td:first-child{font-family:var(--display);font-weight:600;width:40%}
/* chord grid */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
.chcard{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px 8px 8px;text-align:center}
.chcard .cif{font-family:var(--display);font-weight:700;font-size:19px;margin-top:2px}
.chcard .es{font-size:12.5px;color:var(--soft)}
.svgbox{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:6px;display:inline-block}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);z-index:10;
  padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;background:transparent;border:0;cursor:pointer;padding:9px 4px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--soft);font-family:inherit;font-size:12px}
.nav button.on{color:var(--ink)}
.nav button.on .navic{background:var(--cream)}
.navic{width:30px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:9px}
.foot{margin-top:22px;text-align:center;color:var(--soft);font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px}
.pop{animation:pop .18s ease}@keyframes pop{from{transform:scale(.97);opacity:.5}to{transform:scale(1);opacity:1}}
.shake{animation:shake .3s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:380px){ .chgrid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))} .h1{font-size:26px} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
